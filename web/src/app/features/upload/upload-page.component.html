<div id="upload-page-container" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">

  <!-- Top Banner / Heading -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-8 border-b border-slate-200 gap-4">
    <div>
      <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-[#1A365D]">
        <svg lucideLayers class="w-3.5 h-3.5"></svg>
        <span>Workspace / Ingestion Engine</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mt-1">
        Upload Schedule Image
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">
        Digitize handwritten timetables, weekly shift sheets, or printed syllabi.
      </p>
    </div>

    <button
      id="btn-goto-history"
      type="button"
      (click)="navigateToHistory()"
      class="self-start sm:self-auto inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-300 rounded-[2px] elevation-1 transition-all cursor-pointer"
    >
      <svg lucideClock class="w-3.5 h-3.5 text-slate-500"></svg>
      <span>View Parsing History</span>
    </button>
  </div>

  <!-- Error Alert with Recovery CTA if parsing fails -->
  @if (errorMessage()) {
    <div
      class="mb-6 p-4 bg-red-50 border border-red-200 text-red-800 text-xs rounded-[2px] flex items-center justify-between"
      role="alert"
    >
      <div class="flex items-center gap-2">
        <svg lucideAlertCircle class="w-4 h-4 text-red-600 shrink-0"></svg>
        <span>{{ errorMessage() }}</span>
      </div>
      <button
        type="button"
        (click)="errorMessage.set(null)"
        class="px-2.5 py-1 bg-white border border-red-300 text-red-700 hover:bg-red-50 rounded-[2px] font-semibold cursor-pointer"
      >
        Retry
      </button>
    </div>
  }

  <!-- Active Ingestion State or Idle Dropzone -->
  @if (isProcessing()) {
    <app-ingestion-progress
      [fileName]="currentFileName()"
      [previewUrl]="filePreviewUrl()"
      [percent]="progressPercent()"
      [currentStep]="progressStep()"
    />
  } @else {
    <app-file-dropzone (fileDropped)="handleFileDropped($event)" />

    <!-- OCR Best Practices Guidelines -->
    <app-ocr-guidelines />

    <!-- 1-Click Interactive Presets -->
    <app-upload-presets (selectPreset)="handleSelectPreset($event)" />
  }

</div>
