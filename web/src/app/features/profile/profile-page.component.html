<div id="profile-page-container" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

  <!-- Page Header -->
  <div class="pb-6 mb-8 border-b border-slate-200">
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">
      Account Settings & Integrations
    </h1>
    <p class="text-xs sm:text-sm text-slate-500 mt-1">
      Manage your personal profile, linked calendar services, and enterprise quotas.
    </p>
  </div>

  <!-- Settings Card -->
  <div class="bg-white border border-slate-200 rounded-[2px] elevation-1 divide-y divide-slate-200">

    <!-- Section 1: User Details (Inline Editable) -->
    <app-user-details-card
      [user]="authStore.currentUser()"
      (updateField)="onUpdateField($event)"
    />

    <!-- Section 2: Connected Calendars -->
    <app-connected-calendars
      [calendars]="authStore.connectedCalendars()"
      [email]="authStore.userEmail()"
      (toggleCalendar)="onToggleCalendar($event)"
    />

    <!-- Section 3: Subscription & Usage Quota -->
    <app-subscription-quota
      [subscription]="authStore.subscription()"
      (upgradeTier)="onUpgradeTier()"
    />

    <!-- Section 4: Session Sign Out Footer -->
    <div id="section-logout-footer" class="p-6 sm:p-8 bg-[#F8FAFC] flex items-center justify-between">
      <div>
        <h3 class="text-xs font-bold text-slate-800">Sign Out of Session</h3>
        <p class="text-[11px] text-slate-500">
          Clear current authentication token and return to visitor portal.
        </p>
      </div>

      <button
        id="btn-profile-logout"
        type="button"
        (click)="onLogout()"
        class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-slate-600 bg-white border border-slate-300 hover:text-red-700 hover:border-red-300 hover:bg-red-50 rounded-[2px] transition-colors cursor-pointer"
      >
        <svg lucideLogOut class="w-3.5 h-3.5"></svg>
        <span>Log Out</span>
      </button>
    </div>

  </div>

</div>
