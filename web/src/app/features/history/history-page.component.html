<div id="history-page-container" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-6 border-b border-slate-200 gap-4">
    <div>
      <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-[#1A365D]">
        <svg lucideClock class="w-3.5 h-3.5"></svg>
        <span>Archive / Parsing Activity</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mt-1">
        Processed Schedule Documents
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">
        View, re-edit, or re-export previously digitized timetables and agendas.
      </p>
    </div>

    <button
      id="btn-history-upload-new"
      type="button"
      (click)="navigateToUpload()"
      class="self-start sm:self-auto inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold text-white bg-[#1A365D] hover:bg-[#2A4365] rounded-[2px] elevation-1 transition-all cursor-pointer"
    >
      <svg lucideUpload class="w-3.5 h-3.5"></svg>
      <span>Upload New Schedule</span>
    </button>
  </div>

  <!-- Document List or Actionable Empty State -->
  @if (scheduleStore.documents().length === 0) {
    <app-history-empty (uploadNew)="navigateToUpload()" />
  } @else {
    <div class="space-y-3">
      @for (doc of scheduleStore.documents(); track doc.id) {
        <app-history-card
          [doc]="doc"
          (openDocument)="onOpenDocument($event)"
          (exportIcs)="onExportIcs($event)"
          (deleteDocument)="onDeleteDocument($event)"
        />
      }
    </div>
  }

</div>
